apiVersion: v2
name: heraion
description: Finds cluster problems with an LLM and proposes fixes as pull requests.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.27.0-0"
keywords: [ai, llm, agent, mcp, sre, remediation, trivy, alertmanager]
annotations:
  artifacthub.io/license: Apache-2.0
sources:
  - https://github.com/muskats/heraion
dependencies:
  # Optional LLM gateway in front of any provider.
  - name: litellm
    version: "1.108.0"
    repository: oci://ghcr.io/berriai/litellm/chart
    condition: litellm.enabled
  # Optional Grafana MCP server, enabled with mcpServers.grafana.enabled.
  - name: grafana-mcp
    version: "0.34.0"
    repository: https://grafana-community.github.io/helm-charts
    condition: mcpServers.grafana.enabled
