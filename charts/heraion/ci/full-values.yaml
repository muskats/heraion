llm:
  baseURL: http://litellm.example:4000/v1
  model: gpt-4.1
  apiKey:
    csiKey: llm-api-key                    # 1. from the CSI mount
    existingSecret: llm-creds              # 2. optional key
    key: api-key
    value: sk-literal-fallback             # 3. literal
  maxToolResultBytes: 32768
  maxContextBytes: 120000
git:
  provider: gitea
  endpoint: https://git.example.internal
  token: { value: gitea-token-value }
repos: [platform/web, platform/payments-api]
namespaces: [shop, payments]
jira:
  enabled: true
  server: atlassian
  projects: [OPS, SEC]
dryRun: true
mode: safe
playbooks:
  trivy-remediate: { enabled: true, mode: safe }
  alertmanager-triage: { enabled: true }
  custom-report:
    trigger: { manual: true }
    tools: ["grafana.*", "datadog.*"]
    output: report
    prompt: Summarize yesterday's error budget burn.
gateway:
  hooks:
    alertmanager:
      auth: token
      secret: { value: am-secret-value }
  ingress:
    enabled: true
    className: nginx
  autoscaling: { enabled: true }
  podDisruptionBudget: { enabled: true }
mcpServers:
  k8s: { enabled: true }
  atlassian:
    enabled: true
    deploy:
      env:
        - { name: STATELESS, value: "true" }
        - { name: JIRA_URL, value: https://acme.atlassian.net }
        - { name: JIRA_USERNAME, value: heraion-bot@acme.com }
        - { name: JIRA_PROJECTS_FILTER, value: "OPS,SEC,CHG" }
        - { name: CONFLUENCE_URL, value: https://acme.atlassian.net/wiki }
        - { name: CONFLUENCE_USERNAME, value: heraion-bot@acme.com }
        - { name: CONFLUENCE_SPACES_FILTER, value: "RUN,OPS" }
      secretEnv:
        JIRA_API_TOKEN: { existingSecret: atlassian, key: api-token }
        CONFLUENCE_API_TOKEN: { existingSecret: atlassian, key: api-token }   # same token on Cloud
  grafana: { enabled: true }
  datadog:
    enabled: true
    url: https://mcp.datadoghq.com/api/unstable/mcp-server/mcp
    secretHeaders:
      DD-API-KEY: { existingSecret: datadog, key: api-key }
      DD-APPLICATION-KEY: { value: dd-app-key-value }
  vault:
    enabled: true
    mode: external
    url: https://vault-mcp.example.internal/mcp
    secretHeaders:
      Authorization:
        serviceAccountToken: { audience: vault }   # sent as "Bearer <token>"
  custom:
    enabled: true
    mode: deploy
    deploy:
      image: { repository: ghcr.io/example/custom-mcp, tag: "1.0.0" }
      port: 9100
      env: [{ name: LOG_LEVEL, value: info }]
      secretEnv:
        API_TOKEN: { value: custom-token-value }
resourceQuota: { enabled: true }
secrets:
  existingSecret: heraion-shared
  csi:
    enabled: true
    secretProviderClass: heraion-aws
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata: { name: "{{ .Release.Name }}-extra" }
    data: { a: b }
