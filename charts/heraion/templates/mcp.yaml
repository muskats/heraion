{{- /* mode: deploy servers run as sidecars of the worker pod (heraion.mcpSidecars).
       Here: their RBAC, bound to the worker ServiceAccount, and their files. */}}
{{- range $n, $s := .Values.mcpServers }}
{{- if and $s.enabled (eq $s.mode "deploy") }}
{{- $d := $s.deploy }}
{{- $name := include "heraion.mcpName" (dict "root" $ "name" $n) }}
{{- $component := printf "mcp-%s" $n }}
{{- $rbac := $d.rbac | default dict }}
{{- $sa := include "heraion.workerSA" $ }}
{{- if and $.Values.rbac.create $rbac.clusterRules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" $component "name" (printf "%s-%s" (include "heraion.namespace" $) $name)) | nindent 2 }}
rules:
  {{- toYaml $rbac.clusterRules | nindent 2 }}
{{- /* namespaces set: the ClusterRole applies only in those namespaces. */}}
{{- range $ns := $.Values.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" $component "name" (printf "%s-%s" (include "heraion.namespace" $) $name) "namespace" $ns) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" (include "heraion.namespace" $) $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ include "heraion.namespace" $ }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" $component "name" (printf "%s-%s" (include "heraion.namespace" $) $name)) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" (include "heraion.namespace" $) $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ include "heraion.namespace" $ }}
{{- end }}
{{- end }}
{{- if and $.Values.rbac.create $rbac.rules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" $component "name" $name) | nindent 2 }}
rules:
  {{- toYaml $rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" $component "name" $name) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ include "heraion.namespace" $ }}
{{- end }}
{{- if $d.files }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" $component "name" $name) | nindent 2 }}
data:
  {{- range $f, $c := $d.files }}
  {{ $f }}: |
    {{- tpl $c $ | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
