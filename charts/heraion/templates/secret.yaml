{{- $s := include "heraion.inlineSecrets" . | fromYaml }}
{{- if $s }}
apiVersion: v1
kind: Secret
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" "config" "name" (include "heraion.secretName" .)) | nindent 2 }}
type: Opaque
data:
  {{- range $k, $v := $s }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}
