{{- if include "heraion.gatewayEnabled" . }}
{{- $g := .Values.gateway }}
{{- $name := printf "%s-gateway" (include "heraion.fullname" .) }}
{{- include "heraion.checkHooks" . }}
{{- $creds := include "heraion.credentials" (dict "root" $ "role" "gateway") | fromYaml }}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" "gateway" "name" (include "heraion.jobTemplateName" .)) | nindent 2 }}
data:
  job-template.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      labels:
        {{- include "heraion.componentSelector" (dict "root" $ "component" "worker") | nindent 8 }}
    spec:
      {{- include "heraion.workerJobSpec" (dict "root" $ "playbook" "") | nindent 6 }}
{{- if $g.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" "gateway" "name" (include "heraion.gatewaySA" .)) | nindent 2 }}
  {{- with $g.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
# Create Jobs (get: duplicate deliveries; list: maxConcurrentJobs), and the
# Secret with each webhook payload, owned by its Job.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" "gateway" "name" $name) | nindent 2 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create{{ if $g.maxConcurrentJobs }}, list{{ end }}]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" "gateway" "name" $name) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "heraion.gatewaySA" . }}
    namespace: {{ include "heraion.namespace" . }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" "gateway" "name" $name) | nindent 2 }}
spec:
  {{- if not $g.autoscaling.enabled }}
  replicas: {{ $g.replicas }}
  {{- end }}
  revisionHistoryLimit: {{ $g.revisionHistoryLimit }}
  strategy:
    {{- toYaml $g.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "heraion.componentSelector" (dict "root" $ "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "heraion.componentSelector" (dict "root" $ "component" "gateway") | nindent 8 }}
        {{- with $g.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "heraion.checksums" . | nindent 8 }}
        checksum/job-template: {{ include "heraion.workerJobSpec" (dict "root" $ "playbook" "") | sha256sum }}
        {{- with $g.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "heraion.gatewaySA" . }}
      terminationGracePeriodSeconds: {{ $g.terminationGracePeriodSeconds }}
      {{- include "heraion.podScheduling" (dict "root" $ "role" $g "component" "gateway") | nindent 6 }}
      {{- with $g.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "heraion.image" (dict "image" .Values.image "root" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          env:
            - name: HERAION_CONFIG
              value: /etc/heraion/conf/config.yaml
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            {{- include "heraion.credEnv" (dict "root" $ "items" $creds.items) | nindent 12 }}
            {{- with $g.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $g.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml $g.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $g.readinessProbe | nindent 12 }}
          {{- with $g.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          securityContext:
            {{- include "heraion.containerSecurityContext" (dict "root" $ "role" $g) | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/heraion/conf, readOnly: true }
            - { name: playbooks, mountPath: /etc/heraion/playbooks, readOnly: true }
            - { name: job-template, mountPath: /etc/heraion/job, readOnly: true }
            {{- include "heraion.credMounts" (dict "root" $ "items" $creds.items) | nindent 12 }}
            {{- with $g.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with $g.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap: { name: {{ include "heraion.configName" . }} }
        - name: playbooks
          configMap: { name: {{ include "heraion.playbooksName" . }} }
        - name: job-template
          configMap: { name: {{ include "heraion.jobTemplateName" . }} }
        {{- include "heraion.credVolumes" (dict "root" $ "items" $creds.items) | nindent 8 }}
        {{- with $g.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" "gateway" "name" $name) | nindent 2 }}
  {{- with $g.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $g.service.type }}
  selector:
    {{- include "heraion.componentSelector" (dict "root" $ "component" "gateway") | nindent 4 }}
  ports:
    - { name: http, port: {{ $g.service.port }}, targetPort: http, protocol: TCP }
{{- if $g.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" "gateway" "name" $name) | nindent 2 }}
  {{- with $g.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $g.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $g.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $g.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $name }}
                port: { name: http }
          {{- end }}
    {{- end }}
{{- end }}
{{- if $g.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" "gateway" "name" $name) | nindent 2 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $g.autoscaling.minReplicas }}
  maxReplicas: {{ $g.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $g.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- if $g.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  {{- include "heraion.metadata" (dict "root" $ "component" "gateway" "name" $name) | nindent 2 }}
spec:
  {{- if hasKey $g.podDisruptionBudget "maxUnavailable" }}
  maxUnavailable: {{ $g.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ $g.podDisruptionBudget.minAvailable }}
  {{- end }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "heraion.componentSelector" (dict "root" $ "component" "gateway") | nindent 6 }}
{{- end }}
{{- end }}
