suite: mcp connectors
templates:
  - mcp.yaml
set:
  llm: { baseURL: https://api.openai.com/v1, model: m }
tests:
  - it: renders nothing when every connector is off
    asserts:
      - hasDocuments: { count: 0 }
  - it: k8s connector is read-only and only reachable from workers
    set:
      mcpServers.k8s.enabled: true
    documentSelector: { path: "kind", value: NetworkPolicy }
    asserts:
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: worker
  - it: k8s connector ClusterRole has no write verbs
    set:
      mcpServers.k8s.enabled: true
    documentSelector: { path: "kind", value: ClusterRole }
    asserts:
      - notContains: { path: "rules[0].verbs", content: create }
      - notContains: { path: "rules[0].verbs", content: delete }
  - it: k8s connector also refuses Secrets and ConfigMaps in its own config
    set:
      mcpServers.k8s.enabled: true
    documentSelector: { path: kind, value: ConfigMap }
    asserts:
      - matchRegex: { path: 'data["config.toml"]', pattern: 'kind = "Secret"' }
      - matchRegex: { path: 'data["config.toml"]', pattern: 'kind = "ConfigMap"' }
      - matchRegex: { path: 'data["config.toml"]', pattern: "read_only = true" }
  - it: k8s connector ClusterRole cannot read Secrets
    set:
      mcpServers.k8s.enabled: true
    documentSelector: { path: kind, value: ClusterRole }
    asserts:
      - notContains: { path: "rules[0].resources", content: secrets }
      - notContains: { path: "rules[0].resources", content: configmaps }
