suite: secret hierarchy
templates:
  - worker.yaml
  - gateway.yaml
set:
  llm: { baseURL: http://x, model: m }
  playbooks:
    trivy-remediate: { enabled: true }
tests:
  - it: renders file, optional existingSecret and fallback for one credential
    set:
      llm.apiKey:
        serviceAccountToken: { audience: litellm }
        existingSecret: llm
        key: api-key
        value: sk-literal
    documentSelector: { path: kind, value: CronJob }
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: { name: HERAION_LLM_API_KEY_FILE, value: /var/run/secrets/heraion/sa/llm-api-key }
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: HERAION_LLM_API_KEY
            valueFrom: { secretKeyRef: { name: llm, key: api-key, optional: true } }
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: HERAION_LLM_API_KEY_FALLBACK
            valueFrom: { secretKeyRef: { name: RELEASE-NAME-heraion-secrets, key: llm-api-key } }
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: sa-tokens
            projected:
              sources:
                - serviceAccountToken: { audience: litellm, expirationSeconds: 3600, path: llm-api-key }
  - it: uses secrets.existingSecret with default keys
    set:
      secrets.existingSecret: shared
    documentSelector: { path: kind, value: CronJob }
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: HERAION_GIT_TOKEN
            valueFrom: { secretKeyRef: { name: shared, key: git-token, optional: true } }
  - it: renders no secret env when nothing is configured
    documentSelector: { path: kind, value: CronJob }
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          value: [{ name: HERAION_CONFIG, value: /etc/heraion/conf/config.yaml }]
  - it: fails on csiKey without secrets.csi
    template: worker.yaml
    set:
      llm.apiKey.csiKey: llm-api-key
    asserts:
      - failedTemplate:
          errorPattern: secrets.csi.enabled is false
  - it: mounts the CSI volume only where a credential uses csiKey
    template: gateway.yaml
    set:
      secrets.csi: { enabled: true, secretProviderClass: aws }
      llm.apiKey.csiKey: llm-api-key
      playbooks.alertmanager-triage.enabled: true
      gateway.hooks.alertmanager: { auth: token, secret: { existingSecret: am, key: secret } }
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content: { name: csi-secrets, csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: aws } } }
  - it: jira needs an enabled mcp-atlassian server
    template: worker.yaml
    set:
      jira: { enabled: true, projects: [OPS] }
    asserts:
      - failedTemplate:
          errorPattern: jira.server "atlassian" must be an enabled mcpServers entry
  - it: jira workers get no Atlassian token, the MCP server does
    template: worker.yaml
    set:
      secrets.existingSecret: shared
      jira: { enabled: true, projects: [OPS] }
      mcpServers.atlassian.enabled: true
    documentSelector: { path: kind, value: CronJob }
    asserts:
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: { name: HERAION_JIRA_TOKEN }
          any: true
