suite: gateway
templates:
  - gateway.yaml
set:
  llm: { baseURL: https://api.openai.com/v1, model: m }
tests:
  - it: is not rendered without webhook playbooks
    asserts:
      - hasDocuments: { count: 0 }
  - it: fails when a webhook playbook has no hook secret
    set:
      playbooks.alertmanager-triage.enabled: true
    asserts:
      - failedTemplate: {}
  - it: gets only get/create/delete/list on jobs and create on secrets
    set:
      playbooks.alertmanager-triage.enabled: true
      gateway.hooks.alertmanager: { auth: token, secret: { existingSecret: am, key: secret } }
    documentSelector: { path: "kind", value: Role }
    asserts:
      - equal:
          path: rules
          value:
            - { apiGroups: [batch], resources: [jobs], verbs: [get, create, delete, list] }
            - { apiGroups: [""], resources: [secrets], verbs: [create] }
  - it: serves metrics on their own port of the Service
    set:
      playbooks.alertmanager-triage.enabled: true
      gateway.hooks.alertmanager: { auth: token, secret: { existingSecret: am, key: secret } }
    documentSelector: { path: kind, value: Service }
    asserts:
      - contains:
          path: spec.ports
          content: { name: metrics, port: 9090, targetPort: metrics, protocol: TCP }
  - it: renders a ServiceMonitor with extra labels only when enabled
    set:
      playbooks.alertmanager-triage.enabled: true
      gateway.hooks.alertmanager: { auth: token, secret: { existingSecret: am, key: secret } }
      gateway.metrics.serviceMonitor: { enabled: true, labels: { release: kps } }
    documentSelector: { path: kind, value: ServiceMonitor }
    asserts:
      - equal: { path: metadata.labels.release, value: kps }
      - equal: { path: "spec.endpoints[0].port", value: metrics }
