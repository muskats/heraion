# HeraIon chart values. A minimal install sets llm.*, git.* and enables one
# playbook:
#
#   kubectl create secret generic heraion \
#     --from-literal=llm-api-key=sk-... --from-literal=git-token=...
#   helm install heraion oci://ghcr.io/muskats/charts/heraion \
#     --set llm.baseURL=https://api.openai.com/v1 --set llm.model=gpt-4.1 \
#     --set secrets.existingSecret=heraion \
#     --set playbooks.trivy-remediate.enabled=true --set mcpServers.k8s.enabled=true

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""   # install into another namespace than the release's
commonLabels: {}
commonAnnotations: {}

image:
  registry: docker.io
  repository: muskats/heraion
  tag: ""          # default: chart appVersion
  digest: ""       # e.g. sha256:4f2c...; used instead of tag
  pullPolicy: IfNotPresent

# Defaults for every pod. gateway, worker and mcpServers.<name>.deploy can
# override each key.
global:
  imageRegistry: ""     # e.g. registry.example.com: replaces image.registry of every image that has one
  imagePullSecrets: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

# Credentials. Each one (llm.apiKey, git.token, gateway.hooks.<name>.secret,
# mcpServers.<name>.secretHeaders.<header>) can use any of these sources. At
# runtime 1 is used when configured (a missing or empty file fails the run, it
# does not fall back), otherwise the first of 2 and 3 that yields a value:
#
#   1. serviceAccountToken: { audience: litellm }   projected token of the pod's
#                                                   ServiceAccount, rotated by the kubelet
#      csiKey: llm-api-key                          file from the Secrets Store CSI
#                                                   driver (see secrets.csi)
#   2. existingSecret: my-secret, key: api-key      optional; a missing key falls through.
#                                                   Default: secrets.existingSecret and
#                                                   the key in the table below
#   3. value: sk-...                                the chart puts it in its own Secret
#
# Default keys: llm-api-key, git-token,
# hook-<name>, mcp-<server>-<header> (e.g. mcp-datadog-dd-api-key) and
# mcp-<server>-env-<name> for mcpServers.<name>.deploy.secretEnv.
secrets:
  existingSecret: ""   # one Secret for every credential, e.g. "heraion"
  csi:
    enabled: false
    # SecretProviderClass that maps cloud secrets to files, e.g. llm-api-key.
    # The provider authenticates with the pod's ServiceAccount (IRSA, Azure or
    # GKE Workload Identity), so set worker.serviceAccount.annotations.
    secretProviderClass: ""
    mountPath: /var/run/secrets/heraion/csi

llm:
  # Any OpenAI-compatible endpoint, e.g. https://api.openai.com/v1 or
  # http://vllm:8000/v1. Leave empty with litellm.enabled to use LiteLLM.
  baseURL: ""
  model: ""
  apiKey:
    serviceAccountToken: { audience: "", expirationSeconds: 3600 }
    csiKey: ""
    existingSecret: ""
    key: ""          # default llm-api-key
    value: ""
  maxSteps: 30
  maxTokens: 500000
  timeout: 20m
  # Each tool result is cut at this size, 1024 to 262144.
  maxToolResultBytes: 16384
  # History sent per request; above it the oldest tool results (not the last
  # 4) become a one-line stub. 200000 bytes need a model context of about 64k tokens.
  maxContextBytes: 200000
  # temperature: 0.2

git:
  # github, gitlab, gitea, bitbucket, stash, gogs or azure
  provider: github
  endpoint: ""        # self-hosted only, e.g. https://git.example.com
  cloneBaseURL: ""    # default: endpoint, https://github.com or https://gitlab.com;
                      # stash and azure: empty = look clone URLs up through the API
  username: ""        # clone/push user, default x-access-token
  authorName: HeraIon
  authorEmail: heraion@users.noreply.local
  token:
    serviceAccountToken: { audience: "", expirationSeconds: 3600 }
    csiKey: ""
    existingSecret: ""
    key: ""          # default git-token
    value: ""

# create_issue: Jira issues through the mcp-atlassian server named in
# server (mcpServers.atlassian below), with a project allowlist, issue budget,
# de-duplication and dry-run. The server's own jira_create_issue is hidden.
jira:
  enabled: false
  server: atlassian     # an enabled mcpServers entry running mcp-atlassian
  projects: []          # projects issues may be created in, e.g. [OPS]
  issueType: Task
  labels: [heraion]     # added to every issue

# Repos HeraIon may change, e.g. [acme/web, acme/api]. Playbooks can only narrow this.
repos: []

# Kubernetes namespaces the k8s tools may read, e.g. [shop, payments]. Empty = all.
# When set, each deployed MCP server's clusterRules are bound with a RoleBinding
# per namespace instead of cluster-wide. The namespaces must exist.
namespaces: []

# true: log each PR with its diff instead of pushing it.
dryRun: false

# How open_pr delivers a fix, and the riskiest mode a playbook may pick:
#   safe  PR, only for non-breaking changes (same-major version bumps, lockfiles, .trivyignore entries)
#   full  PR for any change
#   yolo  push to the default branch without review; a PR if the push is rejected
mode: full

# Playbooks by name. enabled: false turns one off; a playbook without the key is on.
#   trigger: { schedule: "0 */6 * * *" }   renders a CronJob
#   trigger: { webhook: alertmanager }     runs on POST /hooks/alertmanager
#   mode: safe                             optional; never riskier than the global mode
playbooks:
  trivy-remediate:
    enabled: false   # needs mcpServers.k8s and Trivy Operator
    trigger: { schedule: "0 */6 * * *" }
    tools: [k8s.resources_list, k8s.resources_get, repo_*, open_pr]
    prompt: |
      1. Call k8s.resources_list with apiVersion "aquasecurity.github.io/v1alpha1" and
         kind "VulnerabilityReport" to find Trivy Operator reports, in each allowed
         namespace (all namespaces if none are listed).
         Keep only HIGH and CRITICAL vulnerabilities that have a fixedVersion.
      2. Map each affected image to its source repository among the allowed repos
         (Dockerfiles, Helm values and manifests that reference the image or package).
      3. For each repository, propose the minimal version bump that fixes the CVEs.
      4. Open one PR per repository, with a branch key derived from the fix
         (e.g. "bump-alpine-3.20.3"). List CVEs, severities, workloads, installed
         and fixed versions in the PR body. If nothing is fixable, open no PR.
    output: pr
    guardrails: { maxPRs: 3 }
  alertmanager-triage:
    enabled: false   # needs gateway.hooks.alertmanager and mcpServers.k8s
    trigger: { webhook: alertmanager }
    tools: [k8s.*, repo_*, open_pr, create_issue, atlassian.jira_search, atlassian.jira_get_issue, atlassian.confluence_search, atlassian.confluence_get_page]
    prompt: |
      An Alertmanager webhook delivered the alert group below. For each firing alert,
      identify the workload from its labels, check recent changes and runbooks with the
      atlassian.* tools if they are available, gather evidence with the k8s tools (pod
      status, restarts, events, logs, resource usage, owning controller) and determine
      the most likely root cause. Only if the cause is a configuration value in one of
      the allowed repositories, open one minimal PR (branch key: alertname + workload).
      If it needs a human instead and create_issue is available, create one issue.
      Finish with a short report: summary, evidence, root cause, confidence, next steps.
    output: pr
    guardrails: { maxPRs: 1 }

# Worker: one Job per run.
worker:
  serviceAccount:
    create: true
    name: ""
    annotations: {}   # e.g. eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/heraion
  # Workers do not call the Kubernetes API; the k8s MCP server does.
  automountServiceAccountToken: false
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  workspaceSizeLimit: 2Gi
  cronJob:
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    startingDeadlineSeconds: 600
    timeZone: ""
    suspend: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 1Gi }
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  extraEnv: []         # e.g. [{ name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel:4317 }]
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  extraContainers: []
  initContainers: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

# Gateway: receives webhooks. Only rendered when a webhook playbook is enabled.
gateway:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  terminationGracePeriodSeconds: 30
  maxConcurrentJobs: 5     # over this the gateway returns 429; resourceQuota is the hard cap
  maxBodyBytes: 262144     # larger bodies get 413; at most 1032192 (stored in a Secret)
  # Prometheus metrics at :<port>/metrics on the gateway Service, a separate port
  # from the webhooks. See README "Monitoring" for the metrics.
  metrics:
    enabled: true
    port: 9090
    # prometheus-operator ServiceMonitor; needs the monitoring.coreos.com CRDs.
    serviceMonitor:
      enabled: false
      interval: 30s
      labels: {}          # e.g. { release: kube-prometheus-stack } to match the Prometheus selector
  # Webhooks by name, served at POST /hooks/<name>:
  #
  #   hooks:
  #     alertmanager:                # Authorization: Bearer <secret>
  #       auth: token
  #       secret: {}                 # key hook-alertmanager in secrets.existingSecret
  #     github:                      # X-Hub-Signature-256: sha256=<hmac>
  #       auth: hmac-sha256
  #       secret: { existingSecret: github-webhook, key: secret }
  hooks: {}
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: heraion.example.com
        paths: [{ path: /hooks, pathType: Prefix }]
    tls: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  livenessProbe:
    httpGet: { path: /healthz, port: http }
    periodSeconds: 20
  readinessProbe:
    httpGet: { path: /readyz, port: http }
    periodSeconds: 10
  startupProbe: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  extraContainers: []
  initContainers: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Spread replicas over nodes; the labelSelector is filled in by the chart.
  topologySpreadConstraints:
    - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway }
  priorityClassName: ""

# MCP servers. Tools of server "k8s" are named "k8s.<tool>", e.g. k8s.pods_log.
#   mode: deploy      the chart runs it
#   mode: dependency  a subchart runs it; url points at its Service
#   mode: external    nothing is deployed; set url
# Any name works, e.g. mcpServers.pagerduty. See docs/integrations.md.
mcpServers:
  k8s:
    enabled: false
    mode: deploy
    path: /mcp
    transport: streamable
    allowTools: []          # e.g. [resources_list, pods_*]; empty = all
    denyTools: []
    required: false         # true: fail the run if the server is down
    timeout: 60s
    deploy:
      image:
        registry: quay.io
        repository: containers/kubernetes_mcp_server
        tag: v0.1.2
        # Wins over tag: set digest "" when you change tag.
        digest: sha256:c289505b06079d7f265a6fef977ce1abbfbbb4271772db17db5b58edbf44c255
        pullPolicy: IfNotPresent
      args: ["--config", "/etc/mcp/config.toml"]
      port: 8080
      files:
        config.toml: |
          port = "8080"
          read_only = true
          disable_destructive = true
          stateless = true
          toolsets = ["core"]
          cluster_provider_strategy = "in-cluster"
          # RBAC refuses these too; this keeps them out if the rules are widened.
          [[denied_resources]]
          group = ""
          version = "v1"
          kind = "Secret"
          [[denied_resources]]
          group = ""
          version = "v1"
          kind = "ConfigMap"
      # Read-only. Secrets and ConfigMaps are not readable.
      rbac:
        clusterRules:
          - apiGroups: [""]
            resources: [pods, pods/log, events, services, endpoints, namespaces, nodes, persistentvolumeclaims]
            verbs: [get, list, watch]
          - apiGroups: [apps]
            resources: [deployments, replicasets, statefulsets, daemonsets]
            verbs: [get, list, watch]
          - apiGroups: [batch]
            resources: [jobs, cronjobs]
            verbs: [get, list, watch]
          - apiGroups: [events.k8s.io]
            resources: [events]
            verbs: [get, list, watch]
          - apiGroups: [metrics.k8s.io]
            resources: [pods, nodes]
            verbs: [get, list]
          - apiGroups: [aquasecurity.github.io]
            resources:
              - vulnerabilityreports
              - clustervulnerabilityreports
              - configauditreports
              - clusterconfigauditreports
              - sbomreports
              - clustersbomreports
            verbs: [get, list, watch]
        rules: []
  # Jira and Confluence, Cloud or Data Center:
  # https://github.com/sooperset/mcp-atlassian. The filters bind every tool,
  # reads and writes, e.g. JIRA_PROJECTS_FILTER: "OPS,CHG".
  atlassian:
    enabled: false
    mode: deploy
    path: /mcp
    transport: streamable
    allowTools: []
    denyTools: []
    required: false
    timeout: 60s
    deploy:
      image:
        registry: ghcr.io
        repository: sooperset/mcp-atlassian
        tag: "0.24.7"
        # Wins over tag: set digest "" when you change tag.
        digest: sha256:40e8470584820a32f7e385dadc38bf263536e0ec536f9915bd9036dae1807fb6
        pullPolicy: IfNotPresent
      args: ["--transport", "streamable-http", "--port", "9000"]
      port: 9000
      env:
        - { name: STATELESS, value: "true" }
        - { name: HOME, value: /tmp }
        # The tools HeraIon uses; create_issue needs jira_search and jira_create_issue.
        - { name: ENABLED_TOOLS, value: "jira_search,jira_get_issue,jira_create_issue,confluence_search,confluence_get_page" }
        - { name: JIRA_URL, value: "" }                  # e.g. https://acme.atlassian.net
        - { name: JIRA_PROJECTS_FILTER, value: "" }      # e.g. "OPS,CHG"
        - { name: CONFLUENCE_URL, value: "" }            # e.g. https://acme.atlassian.net/wiki
        - { name: CONFLUENCE_SPACES_FILTER, value: "" }  # e.g. "RUNBOOKS"
      # Cloud: JIRA_USERNAME (env) + JIRA_API_TOKEN. Data Center: JIRA_PERSONAL_TOKEN.
      # Confluence likewise. Default keys mcp-atlassian-env-<name>, e.g.
      # mcp-atlassian-env-jira-api-token.
      secretEnv: {}
      rbac: { clusterRules: [], rules: [] }
  grafana:
    enabled: false          # also installs the grafana-mcp subchart
    mode: dependency
    url: "http://{{ .Release.Name }}-grafana-mcp:8000/mcp"
    transport: streamable
  datadog:
    enabled: false
    mode: external
    # Depends on your Datadog site, see https://docs.datadoghq.com/mcp_server/setup
    url: ""
    secretHeaders:              # keys mcp-datadog-dd-api-key, mcp-datadog-dd-application-key
      DD-API-KEY: {}
      DD-APPLICATION-KEY: {}

# grafana-mcp subchart (grafana-community/grafana-mcp).
grafana-mcp:
  disableWrite: true
  extraArgs: ["--transport", "streamable-http", "--address", "0.0.0.0:8000"]
  grafana:
    url: "http://grafana.monitoring:3000"
    apiKeySecret: { name: "", key: "" }

# LiteLLM subchart (oci://ghcr.io/berriai/litellm/chart). Needs PostgreSQL in
# litellm.database.writer. With llm.baseURL empty, workers use
# http://<release>-litellm-gateway:4000/v1.
litellm:
  enabled: false

rbac:
  create: true

networkPolicy:
  enabled: true
  # Who may call the gateway, e.g. [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]. Empty = anyone.
  gatewayIngressFrom: []
  # Who may scrape gateway.metrics.port, same format. Empty = anyone.
  metricsFrom: []
  # Egress rules for workers. Empty = no egress restriction.
  workerEgress: []

# Hard cap on Jobs in the namespace (count/jobs.batch).
resourceQuota:
  enabled: false
  jobs: 20

# helm test <release> runs `heraion check` with these args.
tests:
  enabled: true
  args: ["--connect"]

# Extra manifests; templated, e.g. name: "{{ .Release.Name }}-extra".
extraObjects: []
