name: ci
# Checks only, nothing is published: pushes to main and pull requests into it.
# release.yaml calls this workflow for a tag before it publishes anything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Every job runs one stage of scripts/ci.sh, so `scripts/ci.sh` locally
# runs the same checks.
jobs:
  test:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [lint, unit, chart, e2e]
    env:
      JUNIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.0
      - name: cache pinned tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/lib.sh', 'go.mod') }}
      - name: install gotestsum (JUnit reports)
        run: go install gotest.tools/gotestsum@v1.13.0
      - run: scripts/ci.sh ${{ matrix.stage }}
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.stage }}
          path: build/
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    needs: test
    env:
      TRIVY_VERSION: 0.76.2
      # sha256 of trivy_<version>_Linux-64bit.tar.gz from the release's checksums.txt
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # amd64 into the local Docker daemon for the scan.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: heraion:ci
      - name: install trivy
        run: |
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "$TRIVY_SHA256  $f" | sha256sum -c -
          tar -xzf "$f" trivy
          sudo install trivy /usr/local/bin/trivy
      - name: scan image
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 heraion:ci
      # arm64 builds too (cross-compiled, so no QEMU needed).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          platforms: linux/arm64
