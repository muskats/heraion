name: ci
# Checks only, nothing is published: pushes to main and pull requests into it.
# Tags run release.yaml instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every job runs one stage of scripts/ci.sh, so `scripts/ci.sh` locally
# runs the same checks.
jobs:
  test:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [lint, unit, chart, e2e]
    env:
      JUNIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0
      - name: cache pinned tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/lib.sh', 'go.mod') }}
      - name: install gotestsum (JUnit reports)
        run: go install gotest.tools/gotestsum@v1.13.0
      - run: scripts/ci.sh ${{ matrix.stage }}
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ matrix.stage }}
          path: build/
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
