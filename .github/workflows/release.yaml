name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # Publish only tags on the default branch, e.g. not a v1.2.3 tag on a
  # feature branch, and only when Chart.yaml has the tag's version.
  on-default-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: tag commit is on the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCH"; then
            echo "::error::$GITHUB_REF_NAME is not on $BRANCH"
            exit 1
          fi
      - name: tag matches Chart.yaml
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

  image:
    runs-on: ubuntu-latest
    needs: on-default-branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Docker Hub: variable DOCKERHUB_USERNAME, secret DOCKERHUB_TOKEN (an
      # access token with Read & Write). The image is docker.io/muskats/heraion,
      # the chart's default image.repository.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The chart's default image tag is its appVersion, which has no "v"
      # prefix (see the chart job), so push both v1.2.3 and 1.2.3.
      - name: image tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: docker.io/muskats/heraion
        run: echo "tags=$IMAGE:$TAG,$IMAGE:${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.0
      # Chart.yaml's version and appVersion equal the tag (checked above).
      - name: package and push OCI chart
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          helm dependency build charts/heraion
          helm package charts/heraion
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "heraion-$v.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
