name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # Publish only tags on the default branch, e.g. not a v1.2.3 tag on a
  # feature branch.
  on-default-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: tag commit is on the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCH"; then
            echo "::error::$GITHUB_REF_NAME is not on $BRANCH"
            exit 1
          fi

  image:
    runs-on: ubuntu-latest
    needs: on-default-branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Docker Hub: variable DOCKERHUB_USERNAME, secret DOCKERHUB_TOKEN (an
      # access token with Read & Write). The image is docker.io/muskats/heraion,
      # the chart's default image.repository.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The chart's default image tag is its appVersion, which has no "v"
      # prefix (see the chart job), so push both v1.2.3 and 1.2.3.
      - name: image tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: docker.io/muskats/heraion
        run: echo "tags=$IMAGE:$TAG,$IMAGE:${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.0
      - name: package and push OCI chart
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          helm dependency build charts/heraion
          helm package charts/heraion --version "$v" --app-version "$v"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "heraion-$v.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
