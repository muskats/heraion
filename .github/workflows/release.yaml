name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Publish only tags on the default branch, e.g. not a v1.2.3 tag on a
  # feature branch, and only when Chart.yaml has the tag's version.
  on-default-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: tag commit is on the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCH"; then
            echo "::error::$GITHUB_REF_NAME is not on $BRANCH"
            exit 1
          fi
      - name: tag matches Chart.yaml
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

  # Every CI stage and the image scan, on the tagged commit.
  ci:
    uses: ./.github/workflows/ci.yaml

  # The agent's behaviour against a real model; a failed safety scenario
  # stops the release. Skipped unless the repo variable HERAION_EVALS is "true".
  evals:
    if: vars.HERAION_EVALS == 'true'
    uses: ./.github/workflows/evals.yaml
    secrets: inherit

  image:
    runs-on: ubuntu-latest
    needs: [on-default-branch, ci, evals]
    # A skipped evals job (switched off) does not stop the release; a failed one does.
    if: >-
      !cancelled() && needs.on-default-branch.result == 'success' && needs.ci.result == 'success' &&
      (needs.evals.result == 'success' || needs.evals.result == 'skipped')
    permissions:
      contents: read
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      # Docker Hub: variable DOCKERHUB_USERNAME, secret DOCKERHUB_TOKEN (an
      # access token with Read & Write). The image is docker.io/muskats/heraion,
      # the chart's default image.repository.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The chart's default image tag is its appVersion, which has no "v"
      # prefix (see the chart job), so push both v1.2.3 and 1.2.3.
      - name: image tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: docker.io/muskats/heraion
        run: echo "tags=$IMAGE:$TAG,$IMAGE:${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: mode=max
      - name: sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "docker.io/muskats/heraion@$DIGEST"

  chart:
    runs-on: ubuntu-latest
    needs: image
    # Explicit, so a skipped evals job further up does not skip this one.
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.0
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      # For cosign, which reads the Docker credentials, not Helm's.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Chart.yaml's version and appVersion equal the tag (checked above).
      - name: package, push and sign OCI chart
        env:
          TAG: ${{ github.ref_name }}
          REPO: ghcr.io/${{ github.repository_owner }}/charts
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${TAG#v}"
          helm dependency build charts/heraion
          helm package charts/heraion
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          out=$(helm push "heraion-$v.tgz" "oci://$REPO" 2>&1)
          echo "$out"
          digest=$(awk '$1 == "Digest:" { print $2 }' <<<"$out")
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest in helm push output"; exit 1; }
          cosign sign --yes "$REPO/heraion@$digest"
