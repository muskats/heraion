# Weekly update PRs. Bumped by hand: tool versions in scripts/lib.sh, and the Go
# version (go.mod toolchain and Dockerfile GO_VERSION, see scripts/check-version.sh).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      k8s: { patterns: ["k8s.io/*", "sigs.k8s.io/*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: helm
    directory: /charts/heraion
    schedule: { interval: weekly }
