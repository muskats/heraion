# Gitea, an in-cluster model behind LiteLLM, and Alertmanager webhooks.
llm:
  model: qwen3-coder          # as named in the LiteLLM model_list
  apiKey: { existingSecret: litellm-master-key, key: key }
litellm:
  enabled: true               # llm.baseURL defaults to http://<release>-litellm-gateway:4000/v1
  # Set model_list as in the LiteLLM chart docs, e.g. pointing at KubeAI
  # (http://kubeai/openai/v1). LiteLLM needs PostgreSQL:
  database:
    writer:
      host: postgres.db.svc
      dbname: litellm
      passwordSecret: { name: litellm-db, usernameKey: username, passwordKey: password }
git:
  provider: gitea
  endpoint: https://git.example.internal
  token: { existingSecret: heraion-git, key: token }
  authorEmail: heraion@example.internal
repos: [platform/web, platform/payments-api]
playbooks:
  trivy-remediate: { enabled: true }
  alertmanager-triage: { enabled: true }
gateway:
  hooks:
    alertmanager:
      auth: token             # Alertmanager: http_config.authorization.credentials
      secret: { existingSecret: heraion-hooks, key: alertmanager }
  autoscaling: { enabled: true, minReplicas: 2 }
  podDisruptionBudget: { enabled: true }
mcpServers:
  k8s: { enabled: true }
resourceQuota: { enabled: true, jobs: 20 }

