# Jira, Confluence, Grafana and Datadog. Enable any subset; a playbook only gets the
# tools its `tools` list matches, e.g. ["grafana.*"].
llm:
  baseURL: https://api.openai.com/v1
  model: gpt-4.1
  apiKey: { existingSecret: heraion-llm, key: api-key }
git:
  provider: github
  token: { existingSecret: heraion-git, key: token }
repos: [acme/web]

mcpServers:
  # Jira and Confluence (Cloud or Data Center): mcp-atlassian, run by the chart.
  # The filters bind every tool: reads, and the issues create_issue opens.
  atlassian:
    enabled: true
    deploy:
      env:
        - { name: STATELESS, value: "true" }
        - { name: HOME, value: /tmp }
        - { name: ENABLED_TOOLS, value: "jira_search,jira_get_issue,jira_create_issue,confluence_search,confluence_get_page" }
        - { name: JIRA_URL, value: "https://jira.example.internal" }
        - { name: JIRA_PROJECTS_FILTER, value: "OPS,CHG" }
        - { name: CONFLUENCE_URL, value: "https://wiki.example.internal" }
        - { name: CONFLUENCE_SPACES_FILTER, value: "RUNBOOKS" }
      secretEnv:   # Data Center PATs; on Cloud: JIRA_USERNAME + JIRA_API_TOKEN instead
        JIRA_PERSONAL_TOKEN: { existingSecret: jira, key: pat }
        CONFLUENCE_PERSONAL_TOKEN: { existingSecret: confluence, key: pat }

  # Grafana: grafana-mcp subchart, writes disabled.
  grafana:
    enabled: true
    allowTools: [search_dashboards, get_dashboard_by_uid, query_prometheus, query_loki_logs, list_datasources]

  # Datadog hosts the server. The URL depends on your site, see
  # https://docs.datadoghq.com/mcp_server/setup (not on GovCloud).
  datadog:
    enabled: true
    url: https://mcp.datadoghq.com/api/unstable/mcp-server/mcp
    secretHeaders:
      DD-API-KEY: { existingSecret: datadog, key: api-key }
      DD-APPLICATION-KEY: { existingSecret: datadog, key: app-key }

grafana-mcp:
  grafana:
    url: http://grafana.monitoring.svc:80
    apiKeySecret: { name: grafana-sa-token, key: token }

# create_issue: through the atlassian server, only in OPS, de-duplicated.
jira:
  enabled: true
  server: atlassian
  projects: [OPS]

playbooks:
  incident-digest:
    trigger: { schedule: "0 8 * * 1-5" }
    tools: ["grafana.*", "datadog.*", atlassian.jira_search, atlassian.confluence_search, create_issue]
    output: report
    prompt: |
      Summarize the last 24 hours for the platform team: firing alerts and error-rate
      spikes (Grafana / Datadog), and open Jira incidents in project OPS with their status.
      Correlate them where possible. Keep it under 300 words. If an error spike has no
      open OPS issue yet, create one (key: "<service>-<date>").
  jira-bug-to-pr:
    trigger: { webhook: jira }       # Jira webhook on "issue created" with label heraion
    tools: [atlassian.jira_get_issue, "grafana.query_loki_logs", repo_*, open_pr]
    prompt: |
      The event is a Jira webhook for a new bug. Read the issue with atlassian.jira_get_issue,
      gather related error logs from Loki, locate the faulty code in acme/web and open
      one minimal PR that fixes it. If the cause is unclear, open no PR and explain why.
    guardrails: { maxPRs: 1, writePaths: ["src/**"] }   # full mode: name what a fix may touch

gateway:
  hooks:
    jira:
      auth: hmac-sha256              # Jira webhook "secret" -> X-Hub-Signature: sha256=<hex>
      header: X-Hub-Signature
      secret: { existingSecret: heraion-hooks, key: jira }
