# Jira, Grafana and Datadog. Enable any subset; a playbook only gets the
# tools its `tools` list matches, e.g. ["grafana.*"].
llm:
  baseURL: https://api.openai.com/v1
  model: gpt-4.1
  apiKey: { existingSecret: heraion-llm, key: api-key }
git:
  provider: github
  token: { existingSecret: heraion-git, key: token }
repos: [acme/web]

mcpServers:
  # Jira Server / Data Center: mcp-atlassian, run by the chart, read-only.
  jira:
    enabled: true
    mode: deploy
    path: /mcp
    allowTools: [jira_search, jira_get_issue, jira_get_project_issues]
    deploy:
      image: { repository: ghcr.io/sooperset/mcp-atlassian, tag: "0.23.1" }
      args: ["--transport", "streamable-http", "--port", "9000"]
      port: 9000
      env:
        - { name: JIRA_URL, value: "https://jira.example.internal" }
        - { name: READ_ONLY_MODE, value: "true" }
        - { name: TOOLSETS, value: "default" }
      secretEnv:
        JIRA_PERSONAL_TOKEN: { existingSecret: jira, key: pat }
  # Jira Cloud: Atlassian hosts the server, nothing is deployed.
  # jira:
  #   enabled: true
  #   mode: external
  #   url: https://mcp.atlassian.com/v1/mcp   # check Atlassian's docs for the current URL
  #   secretHeaders:
  #     Authorization: { existingSecret: jira-cloud, key: authorization }  # "Bearer <token>"

  # Grafana: grafana-mcp subchart, writes disabled.
  grafana:
    enabled: true
    allowTools: [search_dashboards, get_dashboard_by_uid, query_prometheus, query_loki_logs, list_datasources]

  # Datadog hosts the server. The URL depends on your site, see
  # https://docs.datadoghq.com/mcp_server/setup (not on GovCloud).
  datadog:
    enabled: true
    url: https://mcp.datadoghq.com/api/unstable/mcp-server/mcp
    secretHeaders:
      DD-API-KEY: { existingSecret: datadog, key: api-key }
      DD-APPLICATION-KEY: { existingSecret: datadog, key: app-key }

grafana-mcp:
  grafana:
    url: http://grafana.monitoring.svc:80
    apiKeySecret: { name: grafana-sa-token, key: token }

# Issue creation (built-in create_issue tool). The jira MCP server above stays read-only.
jira:
  enabled: true
  url: https://jira.example.internal
  projects: [OPS]              # create_issue
  readSpaces: [CHG, OPS]       # jira_search, jira_get_issue
  token: { existingSecret: jira, key: pat }

# Read-only Confluence pages (runbooks, change logs).
confluence:
  enabled: true
  url: https://wiki.example.internal
  spaces: [RUNBOOKS]
  token: { existingSecret: confluence, key: pat }

playbooks:
  incident-digest:
    trigger: { schedule: "0 8 * * 1-5" }
    tools: ["grafana.*", "datadog.*", jira_search, confluence_search, create_issue]
    output: report
    prompt: |
      Summarize the last 24 hours for the platform team: firing alerts and error-rate
      spikes (Grafana / Datadog), and open Jira incidents in project OPS with their status.
      Correlate them where possible. Keep it under 300 words. If an error spike has no
      open OPS issue yet, create one (key: "<service>-<date>").
  jira-bug-to-pr:
    trigger: { webhook: jira }       # Jira webhook on "issue created" with label heraion
    tools: ["jira.*", "grafana.query_loki_logs", repo_*, open_pr]
    prompt: |
      The event is a Jira webhook for a new bug. Read the issue with the jira tools,
      gather related error logs from Loki, locate the faulty code in acme/web and open
      one minimal PR that fixes it. If the cause is unclear, open no PR and explain why.
    guardrails: { maxPRs: 1 }

gateway:
  hooks:
    jira:
      auth: hmac-sha256              # Jira webhook "secret" -> X-Hub-Signature: sha256=<hex>
      header: X-Hub-Signature
      secret: { existingSecret: heraion-hooks, key: jira }
