# One scheduled playbook, OpenAI, GitHub. Renders a CronJob, its config and
# the k8s MCP server; no gateway.
#
#   kubectl -n heraion create secret generic heraion \
#     --from-literal=llm-api-key=sk-... --from-literal=git-token=ghp_...
#   helm install heraion oci://ghcr.io/muskats/charts/heraion -n heraion -f values-minimal.yaml
secrets:
  existingSecret: heraion   # default keys: llm-api-key, git-token
llm:
  baseURL: https://api.openai.com/v1
  model: gpt-4.1
git:
  provider: github
repos: [acme/web, acme/payments-api]
dryRun: true             # PR diffs go to the Job logs; set false to open PRs
playbooks:
  trivy-remediate: { enabled: true }
mcpServers:
  k8s: { enabled: true }  # reads Trivy Operator reports
