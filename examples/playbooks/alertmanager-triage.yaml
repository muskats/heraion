name: alertmanager-triage
description: Triage a firing Alertmanager alert group and, if the root cause is in config we own, propose a fix.
trigger: { webhook: alertmanager }    # POST /hooks/alertmanager
# Add e.g. grafana.* when that server is enabled.
tools: [k8s.*, repo_*, open_pr, create_issue, atlassian.jira_search, atlassian.jira_get_issue, atlassian.confluence_search, atlassian.confluence_get_page]
prompt: |
  An Alertmanager webhook delivered the alert group below. For each alert with status "firing":
  1. Identify the affected workload from its labels (namespace, pod, deployment, container...).
  2. If the atlassian.* tools are available, look for recent changes, known
     problems and runbooks for this workload (last 7 days).
  3. Gather evidence with the k8s tools: pod status and restarts, recent events, container
     logs (last few hundred lines), resource usage, and the owning Deployment/StatefulSet.
  4. Decide the most likely root cause, citing the evidence. Distinguish symptoms from causes.
  5. Only if the cause is a configuration value in one of the allowed repositories (for
     example a memory limit that is clearly too low, a wrong probe, a bad image tag), open one
     minimal PR fixing it. Otherwise open no PR.
  6. If the problem needs a human (no config fix, or low confidence) and create_issue is
     available, create one Jira issue with the evidence.
  Finish with a short triage report: summary, evidence, root cause, confidence, next steps.
  Alerts with status "resolved" need no investigation; just mention them.
output: pr
# Full mode: writePaths is required and names what a fix may touch.
guardrails: { maxPRs: 1, maxIssues: 1, writePaths: ["deploy/**/values*.yaml", "**/kustomization.yaml"] }
