name: trivy-remediate
description: Propose minimal base-image / dependency bumps for fixable HIGH and CRITICAL CVEs.
trigger: { schedule: "0 */6 * * *" }   # the Helm chart renders a CronJob
# k8s.* tools come from the k8s MCP server; repo_* and open_pr are built in.
tools: [k8s.resources_list, k8s.resources_get, repo_*, open_pr]
prompt: |
  1. Call k8s.resources_list with apiVersion "aquasecurity.github.io/v1alpha1" and
     kind "VulnerabilityReport" (all namespaces) to find Trivy Operator reports.
     Use k8s.resources_get for details. Keep only HIGH and CRITICAL vulnerabilities
     that have a fixedVersion.
  2. Map each affected image (report.artifact.repository / tag) to its source repository
     among the allowed repos: look for Dockerfiles, Helm values and manifests that
     reference the image or the vulnerable package.
  3. For each repository, propose the minimal version bump that fixes the CVEs
     (base image tag, or package/dependency version). Do not refactor anything else.
  4. Open one PR per repository. Use a branch key derived from the fix, for example
     "bump-alpine-3.20.3", so reruns de-duplicate. In the PR body list the CVEs,
     severities, affected workloads, installed and fixed versions.
  If nothing is fixable, open no PR and say so.
output: pr
guardrails: { maxPRs: 3, dryRun: false }
