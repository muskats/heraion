name: trivy-remediate
description: Propose minimal image tag or digest bumps for fixable HIGH and CRITICAL CVEs.
trigger: { schedule: "0 */6 * * *" }   # the Helm chart renders a CronJob
# k8s.* tools come from the k8s MCP server; repo_* and open_pr are built in.
tools: [k8s.resources_list, k8s.resources_get, repo_*, open_pr]
prompt: |
  1. Call k8s.resources_list with apiVersion "aquasecurity.github.io/v1alpha1" and
     kind "VulnerabilityReport" to find Trivy Operator reports, in each allowed
     namespace (all namespaces if none are listed).
     Use k8s.resources_get for details. Keep only HIGH and CRITICAL vulnerabilities
     that have a fixedVersion.
  2. Map each affected image (report.artifact.repository / tag) to its source repository
     among the allowed repos: look for image references in Dockerfiles (FROM), Helm
     values and manifests.
  3. For each repository, change only those image references: the minimal tag bump that
     fixes the CVEs, or a new digest. Leave package manifests alone: their lockfiles
     cannot be updated here. Safe mode also refuses distro releases (alpine 3.18 ->
     3.20); report those in your summary instead.
  4. Open one PR per repository. In the PR body list the CVEs, severities, affected
     workloads, installed and fixed versions.
  If nothing is fixable, open no PR and say so.
output: pr
mode: safe     # only versions (same major; distro images: patch only) and image digests change
guardrails: { maxPRs: 3, dryRun: false }
