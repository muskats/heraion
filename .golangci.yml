# golangci-lint v2. Run with scripts/lint.sh (pins the version).
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose     # HTTP response bodies are closed
    - copyloopvar
    - errorlint     # errors.Is/As instead of == and type assertions
    - gosec         # security: file permissions, weak crypto, SSRF-prone calls
    - misspell
    - nilerr        # returning nil after checking err != nil
    - noctx         # HTTP requests carry a context
    - unconvert
    - usestdlibvars
  settings:
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001"]
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.Root).Close
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers them, with explicit exclusions
        - G304 # file paths from config are trusted (operator input)
        - G703 # same for --event: the operator picks the file
        - G306 # 0644 for files in the repo clone is intended
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests may ignore errors and use fixed file modes.
      - path: (_test\.go|/llmtest/|/scmtest/)
        linters: [errcheck, gosec, noctx, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/muskats/heraion
